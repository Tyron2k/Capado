name: Set up cached uv
description: Share lockfile caching without hiding interpreter versions from Renovate
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        enable-cache: true
        prune-cache: true
        cache-dependency-glob: backend/uv.lock
