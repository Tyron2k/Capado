name: Set up cached uv
description: Share lockfile caching without hiding interpreter versions from Renovate
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        prune-cache: true
        cache-dependency-glob: backend/uv.lock
