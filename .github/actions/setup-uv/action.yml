name: Set up cached uv
description: Share lockfile caching without hiding interpreter versions from Renovate
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        prune-cache: true
        cache-dependency-glob: backend/uv.lock
