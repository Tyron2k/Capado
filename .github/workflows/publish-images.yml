name: Publish container images

on:
  workflow_call:
    inputs:
      channel:
        description: "Publication channel: edge or release"
        required: true
        type: string
      version:
        description: "Release tag; empty for edge builds"
        required: false
        default: ""
        type: string
      source-sha:
        description: Validated immutable commit to build
        required: true
        type: string

permissions: {}

# Edge and release writers share one lock. Ordering is not assumed: preflight
# compares release versions and edge checks main again before promotion.
concurrency:
  group: ghcr-publication-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Validate publication and immutable tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      app-version: ${{ steps.preflight.outputs.app-version }}
      backend-digest: ${{ steps.preflight.outputs.backend-digest }}
      frontend-digest: ${{ steps.preflight.outputs.frontend-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx for registry inspection
        if: inputs.channel == 'release'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker

      - name: Log in to GHCR
        if: inputs.channel == 'release'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight source, version and existing immutable images
        id: preflight
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: python3 .github/scripts/publication.py prepare

  build-and-scan:
    name: Build and scan (${{ matrix.image }})
    needs: prepare
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REUSED_DIGEST: ${{ needs.prepare.outputs[format('{0}-digest', matrix.image)] }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./source/backend
          - image: frontend
            context: ./source/frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-sha }}
          path: source
          persist-credentials: false

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          # This name is only used to derive the normalized repository. The
          # candidate is pushed by digest; no candidate tag is published.
          tags: type=raw,value=candidate
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ inputs.source-sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.app-version }}

      - name: Select normalized image name
        id: image
        env:
          CANDIDATE_TAG: ${{ steps.metadata.outputs.tags }}
        run: echo "image=${CANDIDATE_TAG%:candidate}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: env.REUSED_DIGEST == ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        if: env.REUSED_DIGEST == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only. Public tags are applied by the promote job after
      # both images have passed their vulnerability scans.
      - name: Build candidate by digest
        if: env.REUSED_DIGEST == ''
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          target: production
          platforms: linux/amd64,linux/arm64
          outputs: >-
            type=image,name=${{ steps.image.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=${{ needs.prepare.outputs.app-version }}
          # The production stages update OS packages from the live Alpine/Debian
          # repositories. Reusing that layer would freeze yesterday's package set
          # even when a security fix is already available upstream.
          no-cache-filters: production
          # Keep main edge caches available to release-tag builds. The shared
          # publication lock also serializes cache writers.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Select candidate digest
        id: candidate
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "digest=${REUSED_DIGEST:-$BUILT_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Scan candidate (Trivy)
        id: scan
        env:
          TRIVY_PLATFORM: linux/amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.candidate.outputs.digest }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          output: trivy-${{ matrix.image }}.txt

      - name: Scan ARM64 candidate (Trivy)
        id: scan-arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.candidate.outputs.digest }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          output: trivy-${{ matrix.image }}-arm64.txt

      - name: Report scan findings
        if: always() && steps.candidate.outcome == 'success'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          report="trivy-${IMAGE}.txt"
          if [ -s "$report" ]; then
            cat "$report"
          else
            echo "Trivy: no fixable CRITICAL or HIGH findings in ${IMAGE}."
          fi
          {
            echo "### Trivy — ${IMAGE}"
            echo '```'
            if [ -s "$report" ]; then tail -60 "$report"; else echo "none"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate CycloneDX SBOM
        if: always() && steps.candidate.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.candidate.outputs.digest }}
          format: cyclonedx
          scanners: vuln
          output: sbom-${{ matrix.image }}.json

      - name: Upload scan report and SBOM
        if: always() && steps.candidate.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-${{ matrix.image }}
          overwrite: true
          path: |
            trivy-${{ matrix.image }}*.txt
            sbom-${{ matrix.image }}.json
          if-no-files-found: warn
          retention-days: 90

      - name: Record approved digest
        if: steps.scan.outcome == 'success' && steps.scan-arm64.outcome == 'success'
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${IMAGE}"

      - name: Upload approved digest
        if: steps.scan.outcome == 'success' && steps.scan-arm64.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ matrix.image }}
          overwrite: true
          path: digests/${{ matrix.image }}
          retention-days: 1

  promote:
    name: Promote approved image pair
    needs: [prepare, build-and-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      CHANNEL: ${{ inputs.channel }}
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source-sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx for promotion
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download approved digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Prepare recovery journal before any public writes
        run: python3 .github/scripts/publication.py plan

      - name: Preserve preflight recovery journal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: promotion-preflight-${{ github.run_attempt }}
          path: promotion-journal.json
          if-no-files-found: error
          retention-days: 90

      - name: Promote and verify both images
        id: promotion
        run: python3 .github/scripts/publication.py promote

      - name: Preserve promotion outcome and recovery instructions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: promotion-outcome-${{ github.run_attempt }}
          path: promotion-journal.json
          if-no-files-found: warn
          retention-days: 90

      # This receipt is the edge decision's proof of a fully verified pair.
      - name: Record successful publication
        if: steps.promotion.outputs.published == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: publication-${{ inputs.channel }}
          path: publication.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
