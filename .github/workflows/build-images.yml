name: Build images

# A cheap nightly decision checks whether main has changed since the last
# successful full edge publication, or whether that publication is at least
# seven days old and should be refreshed for moving base-image security fixes.
on:
  schedule:
    - cron: "30 1 * * *" # 02:30 CET / 03:30 CEST
  workflow_dispatch:
    inputs:
      force:
        description: "Build even when the current edge images are still fresh"
        required: false
        default: true
        type: boolean

concurrency:
  group: build-images
  # Never interrupt a publication. The reusable workflow promotes tags only
  # after both images passed their scans.
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  decide:
    name: Decide whether edge needs rebuilding
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decision.outputs.build }}
      reason: ${{ steps.decision.outputs.reason }}

    steps:
      - name: Inspect previous successful publications
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail

          if [ "$FORCE" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual force build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_sha=""
          last_started=""
          run_ids=$(gh api "repos/${REPO}/actions/workflows/build-images.yml/runs?status=success&per_page=20" \
            --jq '.workflow_runs[].id')

          for run_id in $run_ids; do
            built=$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs?per_page=100" \
              --jq 'any(.jobs[]; (.name | contains("Build and scan (backend)")) and .conclusion == "success")')
            if [ "$built" = "true" ]; then
              read -r last_sha last_started < <(
                gh api "repos/${REPO}/actions/runs/${run_id}" --jq '[.head_sha, .run_started_at] | @tsv'
              )
              break
            fi
          done

          if [ -z "$last_sha" ]; then
            build=true
            reason="no previous successful edge publication"
          elif [ "$last_sha" != "$CURRENT_SHA" ]; then
            build=true
            reason="main advanced since the last edge publication"
          else
            last_epoch=$(date -u -d "$last_started" +%s)
            now_epoch=$(date -u +%s)
            if [ $((now_epoch - last_epoch)) -ge 604800 ]; then
              build=true
              reason="edge images are at least seven days old"
            else
              build=false
              reason="edge images already match main and are less than seven days old"
            fi
          fi

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "$reason" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish edge images
    needs: decide
    if: needs.decide.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/publish-images.yml
    with:
      channel: edge
      platforms: linux/amd64,linux/arm64
