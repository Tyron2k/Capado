name: Build images

# A cheap nightly decision checks whether main has changed since the last
# successful full edge publication, or whether that publication is at least
# seven days old and should be refreshed for moving base-image security fixes.
on:
  schedule:
    - cron: "30 1 * * *" # 02:30 CET / 03:30 CEST
  workflow_dispatch:
    inputs:
      force:
        description: "Build even when the current edge images are still fresh"
        required: false
        default: true
        type: boolean

concurrency:
  group: build-images
  # Never interrupt a publication. The reusable workflow promotes tags only
  # after both images passed their scans.
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  decide:
    if: github.ref == 'refs/heads/main'
    name: Decide whether edge needs rebuilding
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decision.outputs.build }}
      reason: ${{ steps.decision.outputs.reason }}

    steps:
      - name: Inspect verified publication receipts
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = true ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            echo 'reason=manual force build' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build-images.yml/runs?status=success&branch=main&per_page=100" > runs.json
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=publication-edge&per_page=100" > artifacts.json
          jq -nr --slurpfile runs runs.json --slurpfile artifacts artifacts.json \
            --arg sha "$GITHUB_SHA" --argjson now "$(date +%s)" '
            [$runs[0][].workflow_runs[] | select(.status == "completed" and
              .conclusion == "success" and .head_branch == "main" and
              (.event == "schedule" or .event == "workflow_dispatch"))]
            | INDEX(.id) as $successful
            | [$artifacts[0][].artifacts[] | select(.name == "publication-edge" and .expired == false)
              | $successful[(.workflow_run.id | tostring)] as $run | select($run != null)
              | {sha: $run.head_sha, time: (.created_at | fromdateiso8601)}]
            | if any(.time > $now) then error("Publication receipt has a future timestamp") else . end
            | max_by(.time)
            | if . == null then {build: true, reason: "no retained successful edge publication"}
              elif .sha != $sha then {build: true, reason: "main advanced since the last edge publication"}
              elif $now - .time >= 604800 then {build: true, reason: "edge images are at least seven days old"}
              else {build: false, reason: "edge images already match main and are less than seven days old"} end
            | to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_OUTPUT"

  publish:
    name: Publish edge images
    needs: decide
    if: needs.decide.outputs.build == 'true'
    permissions:
      contents: read
      actions: read
      packages: write
    uses: $/.github/workflows/publish-images.yml
    with:
      channel: edge
      source-sha: ${{ github.sha }}
