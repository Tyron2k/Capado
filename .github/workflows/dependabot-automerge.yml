name: Dependabot Auto-Merge

# workflow_run keeps the write-capable merge token isolated from the untrusted
# code exercised by CI. This workflow never checks out or executes PR content.
on: # zizmor: ignore[dangerous-triggers] API-only bridge; never checks out or executes PR code.
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Queue minor/patch update
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enable auto-merge for an approved Dependabot update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pr_data=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open \
            --json number,author,headRefOid \
            --jq 'map(select(.author.login == "app/dependabot")) | .[0] // empty')

          if [ -z "$pr_data" ]; then
            echo "No open Dependabot pull request for $HEAD_BRANCH; nothing to do."
            exit 0
          fi

          pr=$(printf '%s' "$pr_data" | jq -r '.number')
          current_sha=$(printf '%s' "$pr_data" | jq -r '.headRefOid')
          if [ "$current_sha" != "$TESTED_SHA" ]; then
            echo "PR #$pr advanced after this CI run; the newer run will decide."
            exit 0
          fi

          messages=$(gh api "repos/$REPO/pulls/$pr/commits" --jq '.[].commit.message')
          update_types=$(printf '%s\n' "$messages" | sed -n 's/^[[:space:]]*update-type: //p' | sort -u)

          if [ -z "$update_types" ]; then
            echo "PR #$pr has no Dependabot update metadata; leaving it for manual review."
            exit 0
          fi

          while IFS= read -r update_type; do
            case "$update_type" in
              version-update:semver-patch|version-update:semver-minor)
                ;;
              version-update:semver-major)
                echo "PR #$pr contains a major update; leaving it for manual review."
                exit 0
                ;;
              *)
                echo "PR #$pr contains unknown update type '$update_type'; leaving it for manual review."
                exit 0
                ;;
            esac
          done <<< "$update_types"

          gh pr merge --repo "$REPO" --auto --squash \
            --match-head-commit "$TESTED_SHA" "$pr"
