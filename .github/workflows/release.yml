name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, scan and publish release images
    uses: $/.github/workflows/publish-images.yml
    with:
      channel: release
      version: ${{ github.event.release.tag_name }}
      source-ref: ${{ github.event.release.tag_name }}
      platforms: linux/amd64,linux/arm64
