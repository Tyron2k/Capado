name: Stale Issues & PRs

on:
  schedule:
    - cron: "0 4 * * 0" # Weekly Sunday 04:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: stale
  cancel-in-progress: false

jobs:
  stale:
    name: Mark inactive discussions
    if: github.ref == 'refs/heads/main'
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had activity in the last 60 days. Maintainers will review it before closing; add a comment if it is still relevant.
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not
            had activity in the last 30 days. Maintainers will review it before closing.
          days-before-issue-stale: 60
          days-before-pr-stale: 30
          days-before-issue-close: -1
          days-before-pr-close: -1
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,bug,enhancement,dependencies"
          exempt-pr-labels: "pinned,security,bug,enhancement,dependencies"
          exempt-all-milestones: true
          exempt-all-assignees: true
          exempt-draft-pr: true
          operations-per-run: 100
