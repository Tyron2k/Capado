name: Docs site

# PATH-FILTERED ON PURPOSE. Actions minutes on this account are metered, and without the filter every
# push to main — including one that only touches backend code — would rebuild and redeploy a site that
# did not change. With it the job runs only when the docs or their configuration actually move.
#
# workflow_dispatch stays available so the site can be republished by hand, e.g. after switching Pages
# on for the first time or after a theme pin changes.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/mkdocs.yml"
      - ".github/docs-requirements.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Least privilege: the deploy needs to write Pages and to mint an OIDC token for the deployment, and
# nothing else. contents stays read.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and do NOT cancel a running one: cancelling mid-deploy can leave Pages
# serving a half-published site. Queueing is the safe behaviour here, unlike CI where cancelling a
# superseded run is what you want.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/docs-requirements.txt

      - name: Install
        run: pip install -r .github/docs-requirements.txt

      # --strict turns a broken internal link or an unrecognised config key into a failed build.
      # Without it MkDocs only warns, and a dead link ships — which is exactly the drift the docs
      # coverage test was added to stop on the API side.
      - name: Build
        run: mkdocs build -f .github/mkdocs.yml --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
