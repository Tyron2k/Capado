name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# Classify by Conventional Commit titles as well as existing labels. The root
# v7 action drafts releases; autolabeling is a separate action, and most of this
# repository's PRs have no labels. Title matching also categorizes past PRs.
categories:
  - title: "🚀 Features"
    semver-increment: minor
    when:
      - conventional:
          type: feat
      - labels: [feature, enhancement]
  - title: "🐛 Bug Fixes"
    when:
      - conventional:
          type: fix
      - labels: [fix, bug]
  - title: "🧹 Maintenance"
    when:
      - conventional:
          types: [chore, ci, refactor, build, perf, test]
      - labels: [dependencies, ci, refactor]
  - title: "📖 Documentation"
    when:
      - conventional:
          type: docs
      - label: documentation
  - title: "Other Changes"

  - type: version-resolver
    semver-increment: major
    when:
      - conventional:
          breaking: true
      - label: breaking
  - type: version-resolver
    semver-increment: patch

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
