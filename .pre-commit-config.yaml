# Pre-commit configuration for the Capado monorepo.
#
# Scope:
#   - backend/ (Python, FastAPI, SQLModel): ruff (lint + autofix + format)
#   - frontend/ (TypeScript, React, Mantine): eslint (local) + prettier
#   - repo-wide hygiene: trailing whitespace, EOF newline, YAML/JSON/TOML
#     validity, merge conflict markers, oversized files.
#
# Install once per clone:
#   pip install pre-commit
#   pre-commit install
#
# Run against all files on demand:
#   pre-commit run --all-files

default_language_version:
  python: python3

# Paths that must never be rewritten by formatters/linters.
# Kept here (not per-hook) to stay consistent across hooks.
exclude: |
  (?x)^(
    backend/\.venv/.*|
    backend/\.hypothesis/.*|
    backend/\.pytest_cache/.*|
    backend/alembic/versions/001_consolidated_baseline_schema\.py|
    frontend/node_modules/.*|
    frontend/dist/.*|
    .*\.min\.(js|css)|
    .*/__pycache__/.*
  )$

repos:
  # ---------------------------------------------------------------------------
  # Generic hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-case-conflict

  # ---------------------------------------------------------------------------
  # Python (backend/)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this in step with ruff in backend/pyproject.toml. Two ruff versions means the hook and a
    # developer's own `ruff check` can disagree, which produces a CI failure nobody can reproduce
    # locally. Renovate includes both in the same non-major update group.
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253 # frozen: v0.16.10
    hooks:
      - id: ruff
        name: ruff (lint, backend)
        args: [--fix]
        files: ^backend/.*\.py$
      - id: ruff-format
        name: ruff format (backend)
        files: ^backend/.*\.py$

  # ---------------------------------------------------------------------------
  # Frontend (frontend/)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: f12edd9c7be1c20cfa42420fd0e6df71e42b51ea # frozen: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: prettier (format, frontend)
        language: node # Also lets Renovate identify additional_dependencies as npm packages.
        files: ^frontend/(src|public)/.*\.(ts|tsx|js|jsx|css|scss|json|md|yaml|yml)$
        additional_dependencies:
          - prettier@3.9.9

  # GitHub accepts syntactically valid YAML that is nevertheless an invalid
  # workflow. actionlint catches event, expression, matrix and shell mistakes
  # before a manual or release-only workflow is needed for the first time.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        # actionlint 1.7.12 predates GitHub's recommended $/ self-repository
        # syntax. Ignore only that known parser gap; all other checks stay on.
        args:
          - -ignore
          - 'reusable workflow call "\$/\.github/workflows/(publish-images|codeql)\.yml"'

  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        language: system
        entry: bash -c 'cd frontend && npm run --silent lint -- "$@"' --
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
        require_serial: true

      - id: vite-build
        name: vite build (frontend)
        language: system
        entry: bash -c 'cd frontend && npm run build'
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
        require_serial: true
