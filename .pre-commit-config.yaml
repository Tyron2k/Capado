# Pre-commit configuration for the Capado monorepo.
#
# Scope:
#   - backend/ (Python, FastAPI, SQLModel): ruff (lint + autofix + format)
#   - frontend/ (TypeScript, React, Mantine): eslint (local) + prettier
#   - repo-wide hygiene: trailing whitespace, EOF newline, YAML/JSON/TOML
#     validity, merge conflict markers, oversized files.
#
# Install once per clone:
#   pip install pre-commit
#   pre-commit install
#
# Run against all files on demand:
#   pre-commit run --all-files

default_language_version:
  python: python3

# Paths that must never be rewritten by formatters/linters.
# Kept here (not per-hook) to stay consistent across hooks.
exclude: |
  (?x)^(
    backend/\.venv/.*|
    backend/\.hypothesis/.*|
    backend/\.pytest_cache/.*|
    backend/alembic/versions/.*|
    frontend/node_modules/.*|
    frontend/dist/.*|
    .*\.min\.(js|css)|
    .*/__pycache__/.*
  )$

repos:
  # ---------------------------------------------------------------------------
  # Generic hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-case-conflict

  # ---------------------------------------------------------------------------
  # Python (backend/)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this in step with ruff in backend/pyproject.toml. Two ruff versions means the hook and a
    # developer's own `ruff check` can disagree, which produces a CI failure nobody can reproduce
    # locally. Dependabot now watches this file too, so both move together.
    rev: v0.16.8
    hooks:
      - id: ruff
        name: ruff (lint, backend)
        args: [--fix]
        files: ^backend/.*\.py$
      - id: ruff-format
        name: ruff format (backend)
        files: ^backend/.*\.py$

  # ---------------------------------------------------------------------------
  # Frontend (frontend/)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: prettier (format, frontend)
        files: ^frontend/(src|public)/.*\.(ts|tsx|js|jsx|css|scss|json|md|yaml|yml)$
        additional_dependencies:
          - prettier@3.9.6

  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        language: system
        entry: bash -c 'cd frontend && npm run --silent lint -- "$@"' --
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
        require_serial: true

      - id: vite-build
        name: vite build (frontend)
        language: system
        entry: bash -c 'cd frontend && npm run build'
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
        require_serial: true
