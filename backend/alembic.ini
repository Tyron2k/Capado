# Alembic-Konfiguration für Kapazitätsplanung MVP

[alembic]
# Pfad zum Migrations-Verzeichnis
script_location = alembic

# Template für neue Migrationen
file_template = %%(rev)s_%%(slug)s

# Allow short revision IDs
truncate_slug_length = 40

# SQLAlchemy-URL wird in env.py aus der Umgebungsvariable gelesen
# sqlalchemy.url wird programmatisch gesetzt
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
